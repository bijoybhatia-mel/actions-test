  name: Hello Practice

  on:
    workflow_dispatch:
      inputs:
        your-name:
          description: "Type your name"
          type: string
          default: "Bijoy"

  jobs:
    say-hello:
      runs-on: ubuntu-latest
      steps:
        - name: Greet
          run: echo "Hello ${{ inputs.your-name }}, this is my first workflow run!"

        - name: Show the date
          run: date

        - name: Deliberately fail so you see a red X
          continue-on-error: true
          run: exit 1

        - name: This still runs because of continue-on-error
          run: echo "See? One failure did not stop me."
